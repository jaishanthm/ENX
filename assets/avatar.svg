<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091326"/>
      <stop offset="50%" stop-color="#0d2342"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="haloGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.9"/>

  <!-- Subtle Cyber Tech Rings -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#0ea5e9" stroke-width="0.75" opacity="0.4"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="#7dd3fc" stroke-width="0.5" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Snow Angel Cyber Wings (Abstract Cybernetic Geometry) -->
  <g opacity="0.75" filter="url(#glow)">
    <!-- Left Wing -->
    <path d="M 90 90 L 30 50 L 50 85 L 20 80 L 45 110 L 25 115 L 75 130 Z" fill="#38bdf8" opacity="0.35"/>
    <path d="M 90 90 L 40 60 L 60 90 L 35 90 L 60 115 L 85 125 Z" stroke="#7dd3fc" stroke-width="1.2" fill="none"/>

    <!-- Right Wing -->
    <path d="M 110 90 L 170 50 L 150 85 L 180 80 L 155 110 L 175 115 L 125 130 Z" fill="#38bdf8" opacity="0.35"/>
    <path d="M 110 90 L 160 60 L 140 90 L 165 90 L 140 115 L 115 125 Z" stroke="#7dd3fc" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Halo / Angel Ring -->
  <ellipse cx="100" cy="48" rx="38" ry="10" fill="none" stroke="url(#haloGrad)" stroke-width="3" filter="url(#glow)"/>
  <ellipse cx="100" cy="48" rx="38" ry="10" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8"/>

  <!-- Character Silhouette & Cyber Armor -->
  <!-- Shoulders / Hood -->
  <path d="M 50 185 C 50 145, 75 130, 100 130 C 125 130, 150 145, 150 185 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <path d="M 75 140 L 100 158 L 125 140" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>

  <!-- Neck -->
  <rect x="92" y="115" width="16" height="18" fill="#f8fafc" opacity="0.9" rx="3"/>

  <!-- Hair Back / Bob Cut Style (Mitsuha Inspired) -->
  <path d="M 68 85 C 65 125, 75 145, 75 145 C 75 145, 85 130, 85 120 C 85 120, 115 120, 115 120 C 115 130, 125 145, 125 145 C 125 145, 135 125, 132 85 Z" fill="#1e293b"/>

  <!-- Head Base -->
  <ellipse cx="100" cy="92" rx="26" ry="30" fill="#f1f5f9"/>

  <!-- Anime Hair Bangs (Dark Indigo / Snow Highlights) -->
  <path d="M 70 85 C 75 60, 125 60, 130 85 C 125 78, 115 75, 105 78 C 98 75, 85 76, 70 85 Z" fill="#091428"/>
  <path d="M 72 82 C 78 95, 82 105, 82 108 C 84 98, 88 88, 92 84 C 95 96, 98 102, 100 102 C 104 94, 108 86, 115 84 C 118 92, 122 106, 126 102 C 127 94, 128 85, 128 82" fill="#0f172a"/>

  <!-- Cyber Visor / HUD Glasses (Glowing Snow Blue) -->
  <path d="M 76 88 C 85 86, 115 86, 124 88 C 127 95, 124 100, 100 102 C 76 100, 73 95, 76 88 Z" fill="url(#visorGrad)" opacity="0.95" filter="url(#glow)"/>
  <line x1="80" y1="94" x2="120" y2="94" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <!-- Visor Data Glyphs -->
  <rect x="83" y="90" width="8" height="2" fill="#ffffff" opacity="0.8"/>
  <rect x="109" y="90" width="8" height="2" fill="#ffffff" opacity="0.8"/>

  <!-- Snow Angel Ribbon Tie (Mitsuha red/cyan cord accent) -->
  <path d="M 96 130 C 90 134, 85 142, 82 152 M 104 130 C 110 134, 115 142, 118 152" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="130" r="3" fill="#38bdf8"/>

  <!-- Snowflake Accent Particles -->
  <g fill="#bae6fd" opacity="0.85">
    <circle cx="45" cy="40" r="1.5"/>
    <circle cx="160" cy="45" r="2"/>
    <circle cx="150" cy="155" r="1.5"/>
    <circle cx="40" cy="140" r="1.8"/>
    <circle cx="90" cy="20" r="1.2"/>
    <circle cx="110" cy="20" r="1.2"/>
  </g>
</svg>
